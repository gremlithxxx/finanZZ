<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas - FinanZ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../styles.css?v=9">
</head>
<body>

    <!-- TARJETA SUPERIOR -->
    <div class="container py-5 card" style="max-width: 600px; margin-top: 20px;">
        <div>
            <h1 class="mb-4" style="text-align: center;">Mis Metas</h1>
        </div>
    </div>

    <!-- CONTENEDOR DE METAS -->
    <div class="container" style="max-width: 600px;">
        <div id="listaMetas" class="row g-3">
            <div class="col-12 text-center text-muted">
                <p>Aún no tienes metas. ¡Crea una con el botón de <strong>+</strong>!</p>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR META -->
    <div class="modal fade py-5" id="modalCrearMeta" tabindex="-1" aria-labelledby="modalCrearMetaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered mx-auto" style="max-width: 600px; width: 100%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCrearMetaLabel">Nueva Meta de Ahorro</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formMeta">
                        <div class="mb-3">
                            <label for="metaNombre" class="form-label">¿Qué quieres lograr?</label>
                            <input type="text" class="form-control" id="metaNombre" placeholder="Ej: Viaje a la playa" required>
                        </div>
                        <div class="mb-3">
                            <label for="metaCosto" class="form-label">Costo total de la meta</label>
                            <input type="number" class="form-control" id="metaCosto" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="metaFecha" class="form-label">Fecha límite</label>
                            <input type="date" class="form-control" id="metaFecha" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarMeta">Crear Meta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ABONAR A META -->
    <div class="modal fade py-5" id="modalAbonar" tabindex="-1" aria-labelledby="modalAbonarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered mx-auto" style="max-width: 600px; width: 100%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAbonarLabel">Abonar a la meta</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="abonarNombreMeta" class="fw-bold"></p>
                    <div class="mb-3">
                        <label for="abonoCantidad" class="form-label">Cantidad a abonar</label>
                        <input type="number" class="form-control" id="abonoCantidad" placeholder="0.00" step="0.01">
                    </div>
                    <!-- ID oculto para identificar la meta exacta -->
                    <input type="hidden" id="abonoId" value="">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnConfirmarAbono">Abonar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVBAR FLOTANTE -->
    <nav class="floating-nav">
        <a class="floating-link" aria-label="crear meta" href="#" data-target="#modalCrearMeta">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
            </svg>
        </a>
        <a class="floating-link active" aria-label="casa" href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
            </svg>
        </a>
    </nav>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfYTV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<script>
    // --- MODALES ---
    function abrirModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "block";
            modal.classList.add("show");
            document.body.style.overflow = "hidden";
        }
    }

    function cerrarModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "none";
            modal.classList.remove("show");
            document.body.style.overflow = "";
        }
    }

    document.querySelectorAll("[data-target]").forEach(function (link) {
        link.addEventListener("click", function (e) {
            e.preventDefault();
            const targetId = link.getAttribute("data-target").substring(1);
            abrirModal(targetId);
        });
    });

    document.querySelectorAll("[data-dismiss='modal']").forEach(function (btn) {
        btn.addEventListener("click", function () {
            const modal = btn.closest(".modal");
            if (modal) cerrarModal(modal.id);
        });
    });

    document.querySelectorAll(".modal").forEach(function (modal) {
        modal.addEventListener("click", function (e) {
            if (e.target === modal) cerrarModal(modal.id);
        });
    });

    // --- LÓGICA DE METAS ---
    document.getElementById("btnGuardarMeta").addEventListener("click", function () {
        const nombre = document.getElementById("metaNombre").value.trim();
        const costo = parseFloat(document.getElementById("metaCosto").value);
        const fechaLimite = document.getElementById("metaFecha").value;

        if (!nombre || isNaN(costo) || costo <= 0 || !fechaLimite) {
            alert("Por favor, completa todos los campos correctamente.");
            return;
        }

        const hoy = new Date();
        const fechaMeta = new Date(fechaLimite + "T00:00:00");
        
        if (fechaMeta < hoy) {
            alert("La fecha límite no puede ser en el pasado.");
            return;
        }

        const diffTiempo = fechaMeta.getTime() - hoy.getTime();
        const diffDias = diffTiempo / (1000 * 3600 * 24);
        const mesesRestantes = Math.max(1, Math.ceil(diffDias / 30)); 
        const ahorroMensual = costo / mesesRestantes;

        const nuevaMeta = {
            id: Date.now().toString(), // ID ÚNICO
            nombre: nombre,
            costo: costo,
            ahorrado: 0,
            fecha: fechaLimite,
            ahorroMensual: ahorroMensual,
            completada: false
        };

        let metas = JSON.parse(localStorage.getItem("metas")) || [];
        metas.push(nuevaMeta);
        localStorage.setItem("metas", JSON.stringify(metas));

        document.getElementById("formMeta").reset();
        cerrarModal("modalCrearMeta");
        renderizarMetas();
    });

    function renderizarMetas() {
        const contenedor = document.getElementById("listaMetas");
        let metas = JSON.parse(localStorage.getItem("metas")) || [];

        if (metas.length === 0) {
            contenedor.innerHTML = '<div class="col-12 text-center text-muted"><p>Aún no tienes metas. ¡Crea una con el botón de <strong>+</strong>!</p></div>';
            return;
        }

        let html = "";
        metas.forEach(function (m) {
            const porcentaje = Math.min((m.ahorrado / m.costo) * 100, 100).toFixed(1);
            const claseBarra = m.completada ? "bg-success" : "bg-primary";
            const estadoTexto = m.completada ? '<span class="badge bg-success mb-2">¡Completada!</span>' : '';

            html += `
                <div class="col-12">
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h5 class="card-title mb-1">${m.nombre}</h5>
                                    <p class="text-muted small mb-2">Límite: ${m.fecha}</p>
                                    ${estadoTexto}
                                </div>
                                <div class="text-end">
                                    <span class="fw-bold">$${m.ahorrado.toFixed(2)}</span>
                                    <span class="text-muted small">/ $${m.costo.toFixed(2)}</span>
                                </div>
                            </div>
                            
                            <div class="progress mt-2 mb-3" style="height: 15px;">
                                <div class="progress-bar ${claseBarra}" role="progressbar" style="width: ${porcentaje}%;" aria-valuenow="${porcentaje}" aria-valuemin="0" aria-valuemax="100">${porcentaje}%</div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted">Ahorro sugerido: $${m.ahorroMensual.toFixed(2)}/mes</small>
                                <div>
                                    <button class="btn btn-sm btn-outline-danger me-2" data-eliminar="${m.id}">Eliminar</button>
                                    <button class="btn btn-sm btn-outline-primary" data-abonar="${m.id}" data-nombre="${m.nombre}">+ Abonar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        contenedor.innerHTML = html;

        // Botones de abonar
        contenedor.querySelectorAll("[data-abonar]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const id = btn.getAttribute("data-abonar");
                const nombre = btn.getAttribute("data-nombre");
                
                document.getElementById("abonarNombreMeta").textContent = "Meta: " + nombre;
                document.getElementById("abonoId").value = id; 
                document.getElementById("abonoCantidad").value = "";
                
                abrirModal("modalAbonar");
            });
        });

        // Botones de eliminar
        contenedor.querySelectorAll("[data-eliminar]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const id = btn.getAttribute("data-eliminar");
                if(confirm("¿Estás seguro de que quieres eliminar esta meta?")) {
                    let metasActuales = JSON.parse(localStorage.getItem("metas")) || [];
                    metasActuales = metasActuales.filter(function(m) { return m.id !== id; });
                    localStorage.setItem("metas", JSON.stringify(metasActuales));
                    renderizarMetas();
                }
            });
        });
    }

    // Confirmar abono
    document.getElementById("btnConfirmarAbono").addEventListener("click", function () {
        const id = document.getElementById("abonoId").value;
        const cantidad = parseFloat(document.getElementById("abonoCantidad").value);

        if (isNaN(cantidad) || cantidad <= 0) {
            alert("Por favor, ingresa una cantidad válida mayor a 0.");
            return;
        }

        let metas = JSON.parse(localStorage.getItem("metas")) || [];
        
        const metaIndex = metas.findIndex(function(m) { return m.id === id; });
        
        if (metaIndex !== -1) {
            metas[metaIndex].ahorrado += cantidad;
            
            if (metas[metaIndex].ahorrado >= metas[metaIndex].costo) {
                metas[metaIndex].ahorrado = metas[metaIndex].costo;
                metas[metaIndex].completada = true;
            }

            localStorage.setItem("metas", JSON.stringify(metas));
            cerrarModal("modalAbonar");
            renderizarMetas();
        }
    });

    document.addEventListener("DOMContentLoaded", renderizarMetas);
</script>

    <script src="../theme.js?v=9"></script>
</body>
</html>
