<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simular - FinanZ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../styles.css?v=27">

    <style>
        .bottom-sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 9999;
            display: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .bottom-sheet-overlay.show { display: block; opacity: 1; }
        
        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background-color: var(--app-nav-bg, #fff); color: var(--app-text, #000);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            z-index: 10000; transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            max-height: 90vh; overflow-y: auto;
        }
        .bottom-sheet.show { bottom: 0; }
        
        .bottom-sheet-handle {
            width: 40px; height: 5px; background-color: #ccc;
            border-radius: 5px; margin: 0 auto 15px auto;
        }
        [data-bs-theme="dark"] .bottom-sheet-handle { background-color: #555; }
        [data-bs-theme="dark"] .bottom-sheet-overlay { background: rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body>

    <!-- TARJETA SUPERIOR -->
    <div class="container py-5 card" style="max-width: 600px; margin-top: 20px;">
        <div>
            <h1 class="mb-4" style="text-align: center;">Simulador</h1>
        </div>
    </div>

    <!-- CONTENEDOR DE SIMULACIONES EN LA PÁGINA -->
    <div class="container mt-4 mb-5" style="max-width: 600px;">
        
        <!-- Filtro por categoría -->
        <div class="mb-3">
            <select class="form-control" id="filtroCategoria">
                <option value="">Todas las categorías</option>
                <option value="Tecnología">Tecnología</option>
                <option value="Hogar">Hogar</option>
                <option value="Transporte">Transporte</option>
                <option value="Salud">Salud</option>
                <option value="Educación">Educación</option>
                <option value="Ocio">Ocio</option>
                <option value="Otros">Otros</option>
            </select>
        </div>

        <div id="listaSimulaciones" class="row g-3">
            <div class="col-12 text-center text-muted">
                <p>No hay simulaciones registradas todavía.</p>
            </div>
        </div>
    </div>

    <!-- FONDO OSCURO -->
    <div class="bottom-sheet-overlay" id="sheetOverlay"></div>

    <!-- ========================================== -->
    <!-- MENÚ FLOTANTE: AGREGAR SIMULACIÓN          -->
    <!-- ========================================== -->
    <div class="bottom-sheet" id="sheetNuevaSimulacion">
        <div class="bottom-sheet-handle"></div>
        <h5 class="text-center mb-4">Nueva Simulación</h5>
        
        <form id="formSimulacion">
            <div class="mb-3">
                <label for="simProducto" class="form-label">¿Qué quieres comprar?</label>
                <input type="text" class="form-control" id="simProducto" placeholder="Ej: Celular nuevo" required>
            </div>
            <div class="mb-3">
                <label for="simCosto" class="form-label">Costo total</label>
                <input type="number" class="form-control" id="simCosto" placeholder="0.00" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="simCategoria" class="form-label">Categoría</label>
                <select class="form-control" id="simCategoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Hogar">Hogar</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Salud">Salud</option>
                    <option value="Educación">Educación</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="simPlazo" class="form-label">Plazo de ahorro</label>
                <select class="form-control" id="simPlazo" required>
                    <option value="3">Corto plazo (3 meses)</option>
                    <option value="6" selected>Mediano plazo (6 meses)</option>
                    <option value="12">Largo plazo (12 meses)</option>
                </select>
            </div>
        </form>
        
        <!-- Resultado del cálculo -->
        <div id="resultadoSimulacion" class="mt-3"></div>
        
        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-secondary" id="btnCerrarSimulacion">Cerrar</button>
            <button type="button" class="btn btn-primary" id="btnSimular">Calcular y Guardar</button>
        </div>
    </div>

    <!-- NAVBAR FLOTANTE -->
    <nav class="floating-nav">
        <!-- Botón para abrir simulador -->
        <a class="floating-link" aria-label="simular" href="#" id="btnAbrirSimulacion">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 1a.5.5 0 0 1 .5.5v6.5a.5.5 0 0 0 .5.5h6.5a.5.5 0 0 1 0 1H9a.5.5 0 0 0-.5.5v6.5a.5.5 0 0 1-1 0V9a.5.5 0 0 0-.5-.5H1.5a.5.5 0 0 1 0-1H7a.5.5 0 0 0 .5-.5V1.5A.5.5 0 0 1 8 1"/>
            </svg>
        </a>
        
        <!-- Botón de Inicio -->
        <a class="floating-link active" aria-label="casa" href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
            </svg>
        </a>
    </nav>

<script>
    // --- CONTROL DEL MENÚ FLOTANTE ---
    const overlay = document.getElementById("sheetOverlay");
    const sheetNuevaSimulacion = document.getElementById("sheetNuevaSimulacion");

    function mostrarPanel(panel) {
        overlay.classList.add("show");
        panel.classList.add("show");
    }

    function cerrarPaneles() {
        overlay.classList.remove("show");
        sheetNuevaSimulacion.classList.remove("show");
    }

    overlay.addEventListener("click", cerrarPaneles);
    document.getElementById("btnCerrarSimulacion").addEventListener("click", cerrarPaneles);

    // --- ABRIR MENÚ DE SIMULACIÓN ---
    document.getElementById("btnAbrirSimulacion").addEventListener("click", function(e) {
        e.preventDefault();
        document.getElementById("formSimulacion").reset();
        document.getElementById("resultadoSimulacion").innerHTML = "";
        mostrarPanel(sheetNuevaSimulacion);
    });

    // --- LÓGICA DE SIMULACIÓN ---
    document.getElementById("btnSimular").addEventListener("click", function () {
        const producto = document.getElementById("simProducto").value.trim();
        const costo = parseFloat(document.getElementById("simCosto").value);
        const categoria = document.getElementById("simCategoria").value;
        const plazo = parseInt(document.getElementById("simPlazo").value);

        if (!producto || isNaN(costo) || costo <= 0 || !categoria) {
            alert("Por favor, completa todos los campos correctamente.");
            return;
        }

        let saldoActual = parseFloat(localStorage.getItem("saldo")) || 0; 
        const ahorroMensual = costo / plazo;
        
        let porcentajeSaldo = 0;
        if (saldoActual > 0) {
            porcentajeSaldo = (ahorroMensual / saldoActual) * 100;
        }

        const resultadoDiv = document.getElementById("resultadoSimulacion");
        let mensajeResultado = `
            <div class="alert alert-info mt-3">
                <h6 class="alert-heading fw-bold">Resultado</h6>
                <p class="mb-1">Para comprar <strong>${producto}</strong> ($${costo.toFixed(2)}) en <strong>${plazo} meses</strong>:</p>
                <h5 class="text-primary mb-2">Debes guardar $${ahorroMensual.toFixed(2)} al mes.</h5>
        `;
        
        if (saldoActual > 0) {
            mensajeResultado += `<small class="text-muted">Esto representa el <strong>${porcentajeSaldo.toFixed(1)}%</strong> de tu saldo actual ($${saldoActual.toFixed(2)}).</small>`;
        }
        mensajeResultado += `</div>`;
        resultadoDiv.innerHTML = mensajeResultado;

        const nuevaSimulacion = {
            producto: producto,
            costo: costo,
            categoria: categoria,
            plazo: plazo,
            ahorroMensual: ahorroMensual,
            fecha: new Date().toLocaleDateString()
        };

        let simulaciones = JSON.parse(localStorage.getItem("simulaciones")) || [];
        simulaciones.push(nuevaSimulacion);
        localStorage.setItem("simulaciones", JSON.stringify(simulaciones));

        document.getElementById("formSimulacion").reset();
        renderizarHistorialSimulaciones();
    });

    // --- MOSTRAR HISTORIAL EN LA PÁGINA ---
    function renderizarHistorialSimulaciones() {
        const contenedor = document.getElementById("listaSimulaciones");
        let simulaciones = JSON.parse(localStorage.getItem("simulaciones")) || [];
        
        const filtro = document.getElementById("filtroCategoria").value;

        if (filtro !== "") {
            simulaciones = simulaciones.filter(function(s) {
                return s.categoria === filtro;
            });
        }

        if (simulaciones.length === 0) {
            contenedor.innerHTML = '<div class="col-12 text-center text-muted"><p>No se encontraron simulaciones.</p></div>';
            return;
        }

        let html = "";
        simulaciones.forEach(function (s) {
            // Encontramos el índice real para eliminar
            let todas = JSON.parse(localStorage.getItem("simulaciones")) || [];
            const indexReal = todas.indexOf(s);

            html += `
                <div class="col-12">
                    <div class="card shadow-sm mb-2">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="card-title mb-1 fw-bold">${s.producto}</h6>
                                    <small class="text-muted d-block">${s.categoria} | ${s.fecha}</small>
                                    <small class="text-muted d-block">Plazo: ${s.plazo} meses</small>
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-secondary mb-1 d-block">Costo: $${parseFloat(s.costo).toFixed(2)}</span>
                                    <span class="badge bg-success mb-2 d-block">Ahorro: $${parseFloat(s.ahorroMensual).toFixed(2)}/mes</span>
                                    <button class="btn btn-sm btn-outline-danger" data-eliminar="${indexReal}">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        contenedor.innerHTML = html;

        // Botones eliminar
        contenedor.querySelectorAll("[data-eliminar]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const index = parseInt(btn.getAttribute("data-eliminar"), 10);
                let simulacionesActuales = JSON.parse(localStorage.getItem("simulaciones") || "[]");
                simulacionesActuales.splice(index, 1);
                localStorage.setItem("simulaciones", JSON.stringify(simulacionesActuales));
                renderizarHistorialSimulaciones();
            });
        });
    }

    // Escuchar el filtro de categorías
    document.getElementById("filtroCategoria").addEventListener("change", renderizarHistorialSimulaciones);

    // Inicializar
    document.addEventListener("DOMContentLoaded", renderizarHistorialSimulaciones);
</script>

    <script src="../theme.js?v=27"></script>
</body>
</html>
