<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - FinanZ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../styles.css?v=7">
</head>
<body>

    <!-- TARJETA SUPERIOR -->
    <div class="container py-5 card" style="max-width: 600px; margin-top: 20px;">
        <div>
            <h1 class="mb-4" style="text-align: center;">Compras</h1>
        </div>
    </div>

    <!-- MODAL REGISTRAR -->
    <div class="modal fade py-5" id="modalRegistrar" tabindex="-1" aria-labelledby="modalRegistrarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered mx-auto" style="max-width: 600px; width: 100%;">
            <div class="modal-content">
                <div class="modal-body">
                    <form id="formCompra">
                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto</label>
                            <input type="text" class="form-control" id="producto" placeholder="Ej: Leche">
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio" placeholder="0.00" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-control" id="categoria">
                                <option value="">Selecciona una categoría</option>
                                <option value="alimentos">Alimentos</option>
                                <option value="tecnologia">Tecnología</option>
                                <option value="cuidadopersonal">Cuidado personal</option>
                                <option value="hogar">Hogar</option>
                                <option value="mascotas">Mascotas</option>
                                <option value="salud">Salud</option>
                                <option value="pasatiempos">Pasatiempos</option>
                                <option value="servicios">Servicios</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="concepto" class="form-label">Concepto</label>
                            <textarea class="form-control" id="concepto" rows="3" placeholder="Opcional"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
                </div>
            </div>
        </div>
    </div>

<!-- MODAL HISTORIAL -->
<div class="modal fade py-5" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable mx-auto" style="max-width: 600px; width: 100%;">
        <div class="modal-content">
            <div class="modal-body">
                
                <!-- NUEVO: Buscador -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="buscadorHistorial" placeholder="Buscar por producto...">
                </div>

                <div id="listaCompras">
                    <p class="text-muted text-center">No hay compras registradas todavía.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

    <!-- NAVBAR FLOTANTE -->
    <nav class="floating-nav">
        <a class="floating-link" aria-label="agregar" href="#" data-target="#modalRegistrar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
            </svg>
        </a>
        <a class="floating-link" aria-label="historial" href="#" data-target="#modalHistorial">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bookmark-fill" viewBox="0 0 16 16">
                <path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/>
            </svg>
        </a>
        <a class="floating-link active" aria-label="casa" href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
            </svg>
        </a>
    </nav>
    

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<script>
    // --- ABRIR Y CERRAR MODALES ---
    function abrirModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "block";
            modal.classList.add("show");
            document.body.style.overflow = "hidden";
        }
    }

    function cerrarModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = "none";
            modal.classList.remove("show");
            document.body.style.overflow = "";
        }
    }

    // Escuchar botones de abrir
    document.querySelectorAll("[data-target]").forEach(function (link) {
        link.addEventListener("click", function (e) {
            e.preventDefault();
            const targetId = link.getAttribute("data-target").substring(1);
            abrirModal(targetId);
            
            // Si abre el historial, limpiamos el buscador y renderizamos
            if (targetId === "modalHistorial") {
                document.getElementById("buscadorHistorial").value = "";
                renderizarHistorial();
            }
        });
    });

    // Escuchar botones de cerrar
    document.querySelectorAll("[data-dismiss='modal']").forEach(function (btn) {
        btn.addEventListener("click", function () {
            const modal = btn.closest(".modal");
            if (modal) cerrarModal(modal.id);
        });
    });

    // Cerrar al hacer clic fuera del modal
    document.querySelectorAll(".modal").forEach(function (modal) {
        modal.addEventListener("click", function (e) {
            if (e.target === modal) cerrarModal(modal.id);
        });
    });

    // Cerrar con la tecla Escape
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            document.querySelectorAll(".modal.show").forEach(function (m) {
                cerrarModal(m.id);
            });
        }
    });

    // --- GUARDAR COMPRA ---
    document.getElementById("btnGuardar").addEventListener("click", function () {
        const producto = document.getElementById("producto").value.trim();
        const precio = document.getElementById("precio").value;
        const categoria = document.getElementById("categoria").value;
        const concepto = document.getElementById("concepto").value;

        if (!producto || !precio) {
            alert("Por favor, completa los campos obligatorios (producto y precio).");
            return;
        }

        const compra = {
            producto: producto,
            precio: precio,
            categoria: categoria,
            concepto: concepto
        };

        let compras = JSON.parse(localStorage.getItem("compras")) || [];
        compras.push(compra);
        localStorage.setItem("compras", JSON.stringify(compras));

        cerrarModal("modalRegistrar");
        document.getElementById("formCompra").reset();
    });

    // --- MOSTRAR HISTORIAL CON BUSCADOR ---
    function renderizarHistorial() {
        const contenedor = document.getElementById("listaCompras");
        const data = localStorage.getItem("compras");
        const compras = data ? JSON.parse(data) : [];
        
        // Capturamos el texto de búsqueda
        const busqueda = document.getElementById("buscadorHistorial").value.toLowerCase();

        // Filtramos las compras
        const filtradas = compras.filter(function(c) {
            return c.producto.toLowerCase().includes(busqueda);
        });

        if (filtradas.length === 0) {
            contenedor.innerHTML = '<p class="text-muted text-center">No se encontraron compras.</p>';
            return;
        }

        let html = '<div class="list-group">';
        filtradas.forEach(function (c) {
            // Buscamos el índice real para no fallar al eliminar
            const indexReal = compras.indexOf(c);
            
            html += '<div class="list-group-item">';
            html += '<div class="d-flex justify-content-between align-items-center">';
            html += '<div>';
            html += '<h6 class="mb-1">' + c.producto + '</h6>';
            html += '<small class="text-muted">' + (c.categoria || "Sin categoría") + '</small>';
            if (c.concepto) html += '<p class="mb-0 small">' + c.concepto + '</p>';
            html += '</div>';
            html += '<div class="text-end">';
            html += '<span class="badge bg-primary mb-2">$' + parseFloat(c.precio).toFixed(2) + '</span><br>';
            html += '<button class="btn btn-sm btn-outline-danger" data-eliminar="' + indexReal + '">Eliminar</button>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        contenedor.innerHTML = html;

        // Escuchar los botones de eliminar
        contenedor.querySelectorAll("[data-eliminar]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const index = parseInt(btn.getAttribute("data-eliminar"), 10);
                const comprasActuales = JSON.parse(localStorage.getItem("compras") || "[]");
                comprasActuales.splice(index, 1);
                localStorage.setItem("compras", JSON.stringify(comprasActuales));
                renderizarHistorial();
            });
        });
    }

    // Escuchar el buscador en tiempo real
    document.getElementById("buscadorHistorial").addEventListener("input", renderizarHistorial);
</script>

    <script src="../theme.js?v=7"></script>
</body>
</html>
